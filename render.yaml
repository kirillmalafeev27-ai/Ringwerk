services:
  - type: web
    name: ringwerk
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && DEPLOY_TARGET=node npm run build
    startCommand: npm run start:node
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
